<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>maidmaidmaid Apps</title>
  <meta name="description" content="maidmaidmaid が公開しているアプリ・Chrome拡張機能の一覧です">
  <style>
    body{font-family:"Segoe UI","Yu Gothic UI",sans-serif;color:#172033;background:#f6f8fb;margin:0;line-height:1.7}
    main{max-width:920px;margin:48px auto;padding:0 20px}
    h1{font-size:34px;margin:0 0 8px}.lead{color:#596579;margin-bottom:30px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
    .card{background:#fff;border:1px solid #e3e8ef;border-radius:16px;padding:26px;box-shadow:0 6px 24px rgba(20,35,60,.06)}
    .card h2{font-size:21px;margin:0 0 10px}.card p{color:#46536a}
    a{color:#1367d1;text-decoration:none}a:hover{text-decoration:underline}
    .open{display:inline-block;margin-top:8px;font-weight:600}
    footer{margin-top:30px;color:#687386;font-size:14px}
  </style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <p class="lead">公開しているアプリ・Chrome拡張機能</p>

  <div class="grid">
    <section class="card">
      <h2>Self Bookmark Mail</h2>
      <p>現在開いているWebページのタイトルとURLを、右クリックからGmailで指定したメールアドレスへ送信するChrome拡張機能です</p>
      <a class="open" href="/self-bookmark-mail/">詳細を見る</a>
    </section>

    <section class="card">
      <h2>Right Click to Google Calendar</h2>
      <p>Webページで選択した文字列を、右クリックからGoogle Calendarの予定作成画面へ送るChrome拡張機能です</p>
      <a class="open" href="/right-click-to-google-calendar/">詳細を見る</a>
    </section>
  </div>

  <footer>Developer: maidmaidmaid</footer>
</main>
</body>
</html>
